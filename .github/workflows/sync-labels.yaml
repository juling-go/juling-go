name: Sync Labels to All Repos

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yaml'    # 💡 파일 확장자를 아래 config-file과 동일하게 맞추세요. (.yml 또는 .yaml)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false           # 💡 한 저장소 동기화가 실패해도 나머지 저장소는 마저 진행하도록 설정
      matrix:
        repository: 
          - juling-go/juling-go
          - juling-go/data
          - juling-go/backend
          - juling-go/frontend

    steps:
      - uses: actions/checkout@v6

      - name: Sync labels for ${{ matrix.repository }}
        uses: EndBug/label-sync@v2
        env:
          # 💡 핵심 포인트: 액션이 작동할 타겟 저장소를 Matrix 변수로 덮어씌웁니다.
          GITHUB_REPOSITORY: ${{ matrix.repository }}
        with:
          config-file: .github/labels.yaml # 위 paths와 확장자 일치 확인
          delete-other-labels: true
          token: ${{ secrets.ORG_PAT }}
