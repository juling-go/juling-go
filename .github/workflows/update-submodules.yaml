name: Update Submodules

on:
  # Triggered by submodule repositories (recommended)
  repository_dispatch:
    types:
      - submodule-main-push

  # Fallback: periodic check (optional but useful)
  schedule:
    - cron: '* 6 * * 1'
      timezone: 'Asia/Seoul'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-submodules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: main
          persist-credentials: true
          token: ${{ github.token }}

      - name: Select submodules to update
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
        run: |
          set -euo pipefail

          # Default: update all (schedule / manual)
          targets="backend frontend data"

          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            if [[ -z "${SOURCE_REPO}" ]]; then
              echo "Missing client_payload.source_repo"
              exit 1
            fi

            if [[ -n "${SOURCE_REF}" && "${SOURCE_REF}" != "refs/heads/main" ]]; then
              echo "Ignoring non-main push: ${SOURCE_REF}"
              exit 0
            fi

            case "${SOURCE_REPO}" in
              juling-go/backend)  targets="backend" ;;
              juling-go/frontend) targets="frontend" ;;
              juling-go/data)     targets="data" ;;
              *)
                echo "Unknown source_repo: ${SOURCE_REPO}"
                exit 1
                ;;
            esac
          fi

          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "Selected targets: ${targets}"

      - name: Update selected submodules to latest main
        shell: bash
        env:
          TARGETS: ${{ steps.select.outputs.targets }}
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

          # Update only the selected submodule(s) when dispatched; otherwise update all.
          # (branch=main is set in .gitmodules)
          for path in ${TARGETS}; do
            echo "Updating submodule: ${path}"
            git submodule update --remote -- "${path}"
          done

          echo "--- git status ---"
          git status --porcelain

      - name: Commit and push to main if changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .gitmodules backend frontend data
          git commit -m "chore: update submodule references"

          # In case main moved since checkout (rare, but safe)
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Pushed submodule pointer update to main."
